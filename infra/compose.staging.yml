services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web-static
    ports:
      - "8080:8080"
    restart: unless-stopped

  game-client:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: game-client-static
      args:
        VITE_GAME_SERVER_URL: ${PUBLIC_GAME_SERVER_URL:-http://localhost:2567}
        VITE_PLATFORM_API_URL: ${PUBLIC_PLATFORM_API_URL:-http://localhost:3000}
    ports:
      - "8081:8080"
    restart: unless-stopped

  platform-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: platform-api
    environment:
      PLATFORM_API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://foodfight:foodfight@postgres:5432/foodfight}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  game-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: game-server
    environment:
      GAME_SERVER_PORT: 2567
      TICK_METRICS_REPORT_MS: ${TICK_METRICS_REPORT_MS:-60000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "2567:2567"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodfight
      POSTGRES_USER: foodfight
      POSTGRES_PASSWORD: foodfight
    volumes:
      - foodfight-postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfight -d foodfight"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  foodfight-postgres:
