# Temporary one-time bootstrap: remove after this branch has a committed pnpm-lock.yaml.
name: Bootstrap pnpm lockfile
on:
  push:
    branches:
      - chore/reproducible-dependencies

permissions:
  contents: write

jobs:
  resolve-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Resolve workspace dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile to the feature branch
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: resolve and commit pnpm workspace lockfile"
          git push origin HEAD:refs/heads/chore/reproducible-dependencies
